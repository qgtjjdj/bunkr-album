name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test parser
        run: dotnet test tests/BunkrAlbum.Core.Tests/BunkrAlbum.Core.Tests.csproj -c Release --nologo

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android workload
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            dotnet workload install android && exit 0
            echo "Workload-Installation fehlgeschlagen, Versuch ${attempt}"
            sleep 15
          done
          exit 1

      - name: Android SDK
        run: >
          dotnet build src/BunkrAlbum/BunkrAlbum.csproj
          -c Release
          -f net8.0-android
          -t:InstallAndroidDependencies
          -p:AcceptAndroidSDKLicenses=true

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "${GITHUB_ENV}"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "${GITHUB_ENV}"
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "${GITHUB_ENV}"
          else
            keytool -genkeypair -v \
              -keystore "${RUNNER_TEMP}/release.keystore" \
              -alias bunkr \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Bunkr Album, OU=CI, O=BunkrAlbum, C=US"
            echo "STORE_PASS=android" >> "${GITHUB_ENV}"
            echo "KEY_ALIAS=bunkr" >> "${GITHUB_ENV}"
            echo "KEY_PASS=android" >> "${GITHUB_ENV}"
          fi
          echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"

      - name: Publish APK
        run: >
          dotnet publish src/BunkrAlbum/BunkrAlbum.csproj
          -c Release
          -f net8.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="${KEYSTORE_PATH}"
          -p:AndroidSigningStorePass="${STORE_PASS}"
          -p:AndroidSigningKeyAlias="${KEY_ALIAS}"
          -p:AndroidSigningKeyPass="${KEY_PASS}"
          -p:AcceptAndroidSDKLicenses=true

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find src/BunkrAlbum/bin -type f -name '*Signed.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Keine signierte APK gefunden"
            find src/BunkrAlbum/bin -type f -name '*.apk' -print
            exit 1
          fi
          cp "${apks[0]}" dist/BunkrAlbum.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: BunkrAlbum-apk
          path: dist/BunkrAlbum.apk
          if-no-files-found: error
